services:
  comfyui-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      COMFYUI_URL: ${COMFYUI_URL:-http://127.0.0.1:8188}
      SERVER_PORT: 8080
      DATA_DIR: /data
      DB_PATH: /data/db/comfyui.db
      STATIC_DIR: /static
    volumes:
      - ./data:/data
    restart: unless-stopped
